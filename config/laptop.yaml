# Laptop target: real webcam, fake hardware for everything else.
device_id: laptop-karthik
target: laptop

classes: [enclosure, body, lid]   # 0 = closed printed enclosure, 1 = Model 1 (body), 2 = Model 2 (lid)

camera:
  type: webcam          # webcam | video | picamera2
  index: 0
  path: data/raw/videos/demo.mp4   # used when type = video
  width: 640
  height: 480
  fps: 30
  loop: true

camera2:                # second stream for the two-stream pipeline (M3)
  type: video
  path: data/raw/videos/demo.mp4
  width: 640
  height: 480
  fps: 30
  loop: true

detector:
  backend: ultralytics  # ultralytics | onnx | tflite
  model: models/best.pt
  fallback_model: yolov8n.pt   # public COCO weights, only used before my model is trained
  imgsz: 320
  conf: 0.25
  iou: 0.45
  threads: 4

decide:
  trigger_classes: [enclosure]
  conf_threshold: 0.60
  n: 3                  # N detections ...
  m: 5                  # ... within the last M frames
  cooldown_s: 2.0
  action: pulse         # pulse | latch
  pulse_s: 0.5
  camera_timeout_s: 1.0
  safe_state: stop      # actuator state asserted on camera loss

actuator:
  type: console         # console | gpio
  pin: 17
  active_high: true

imu:
  type: csv_replay      # csv_replay | mpu6050
  path: data/imu/synthetic/normal_1.csv
  rate_hz: 200
  i2c_bus: 1
  address: 0x68

anomaly:
  window_s: 1.0
  model_path: models/anomaly.json
  threshold_percentile: 99.5

plc:
  type: fake            # fake | modbus
  host: 127.0.0.1
  port: 502
  unit_id: 1
  coil: 0               # %QX0.0 in OpenPLC
  register: 0           # %QW0 in OpenPLC (count)

mqtt:
  enabled: false
  host: localhost
  port: 8883
  tls: true
  ca: docker/mosquitto/certs/ca.crt
  username: edge
  password_env: MQTT_PASSWORD

dashboard:
  host: 0.0.0.0
  port: 8000

logging:
  dir: logs
  max_bytes: 1000000
  backups: 5
