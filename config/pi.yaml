# Raspberry Pi target: real camera, GPIO relay/LED, MPU6050, OpenPLC over Modbus TCP.
device_id: pi-karthik
target: pi

classes: [enclosure, body, lid]   # 0 = closed printed enclosure, 1 = Model 1 (body), 2 = Model 2 (lid)

camera:
  type: picamera2       # use "webcam" with index 0 for a USB camera
  index: 0
  width: 640
  height: 480
  fps: 30

camera2:
  type: webcam          # USB webcam as the second stream
  index: 0
  width: 640
  height: 480
  fps: 30

detector:
  backend: tflite       # tflite | onnx | ultralytics
  model: models/best_int8.tflite
  imgsz: 320
  conf: 0.25
  iou: 0.45
  threads: 4

decide:
  trigger_classes: [enclosure]
  conf_threshold: 0.60
  n: 3
  m: 5
  cooldown_s: 2.0
  rearm_on_clear: true
  action: pulse
  pulse_s: 0.5
  camera_timeout_s: 1.0
  safe_state: run_permit_off

reject:
  type: gpio
  pin: 27               # BCM 27 = physical pin 13 -> LED (330 ohm) or relay 2 IN
  active_high: true

run_permit:
  type: gpio
  pin: 17               # BCM 17 = physical pin 11 -> relay 1 IN (conveyor allowed while energised)
  active_high: true

inspection:             # M5 pass/fail (src/edgevision/inspect.py)
  enabled: false          # true (or app --inspect): the decision rule fires on FAIL verdicts
  model_path: models/inspection.json

imu:
  type: mpu6050
  rate_hz: 200
  i2c_bus: 1
  address: 0x68

anomaly:
  window_s: 1.0
  step_s: 0.5
  alert_n: 2            # alert after 2 windows in a row above threshold
  model_path: models/anomaly.json
  threshold_percentile: 99.5

plc:
  type: modbus
  host: 127.0.0.1       # OpenPLC runtime on the Pi; change to the real PLC's IP if provided
  port: 502
  unit_id: 1
  coil: 0
  register: 0

mqtt:
  enabled: true
  host: localhost
  port: 8883
  tls: true
  ca: docker/mosquitto/certs/ca.crt
  username: edge
  password_env: MQTT_PASSWORD

dashboard:
  host: 0.0.0.0
  port: 8000

logging:
  dir: logs
  max_bytes: 1000000
  backups: 5
